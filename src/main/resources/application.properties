server.port=8082
spring.application.name=servicio-reclamos

# Conexión a la Base de Datos MySQL (recuerda tener creada la BD 'db_reclamos')
spring.datasource.url=jdbc:mysql://localhost:3306/db_reclamos?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Registro en Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/